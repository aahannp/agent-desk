<!doctype html>
<!-- Agent Desk app icon, drawn on Apple's 1024 grid: an 824px tile centred on a transparent canvas.
     #small is the simpler version for 32 point icons, #tiny the plainest one for 16 pixels. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
<svg id="icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"></svg>
<script type="module">
const size = location.hash.slice(1) || 'full';
const full = size === 'full';

// Rounded rectangle with Apple-style continuous corners (Figma's corner smoothing, 60%).
function squircle(x, y, w, h, r, smoothing = 0.6) {
  const rad = deg => deg * Math.PI / 180;
  const p = (1 + smoothing) * r;
  const arc = 90 * (1 - smoothing);
  const L = Math.sin(rad(arc / 2)) * r * Math.SQRT2;
  const c = r * Math.tan(rad((90 - arc) / 4)) * Math.cos(rad(45 * smoothing));
  const d = c * Math.tan(rad(45 * smoothing));
  const b = (p - L - c - d) / 3;
  const n = v => +v.toFixed(3);
  const [A, AB, ABC, C, D, BC, l] = [2 * b, 3 * b, 3 * b + c, c, d, b + c, L].map(n);
  return `M ${n(x + w - p)} ${y}
    c ${A} 0 ${AB} 0 ${ABC} ${D} a ${r} ${r} 0 0 1 ${l} ${l} c ${D} ${C} ${D} ${BC} ${D} ${ABC} L ${x + w} ${n(y + h - p)}
    c 0 ${A} 0 ${AB} ${-D} ${ABC} a ${r} ${r} 0 0 1 ${-l} ${l} c ${-C} ${D} ${-BC} ${D} ${-ABC} ${D} L ${n(x + p)} ${y + h}
    c ${-A} 0 ${-AB} 0 ${-ABC} ${-D} a ${r} ${r} 0 0 1 ${-l} ${-l} c ${-D} ${-C} ${-D} ${-BC} ${-D} ${-ABC} L ${x} ${n(y + p)}
    c 0 ${-A} 0 ${-AB} ${D} ${-ABC} a ${r} ${r} 0 0 1 ${l} ${-l} c ${C} ${-D} ${BC} ${-D} ${ABC} ${-D} Z`;
}

const tile = squircle(100, 100, 824, 824, 185);

// The mark: a capital A folded down its centre, so each half is one flat colour and the right half sits
// in shade. The crossbar is the pink cursor, and it folds with the letter. Small icons get thicker strokes
// and a taller crossbar so both survive at 32 and 16 pixels.
const { foot, t, bar } = {
  full: { foot: 236, t: 118, bar: [584, 656] },
  small: { foot: 252, t: 138, bar: [574, 664] },
  tiny: { foot: 262, t: 150, bar: [566, 676] },
}[size];
const top = 298, bot = 742, apex = 34; // as a module these don't clash with window.top
const L0 = 512 - foot, R0 = 512 + foot, s = (512 - apex - L0) / (bot - top);
const yin = bot - (512 - (L0 + t)) / s; // where the inner edges meet, parallel to the outer ones
const hw = y => (y - yin) * s;
const [b1, b2] = bar;

document.getElementById('icon').innerHTML = `
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.32"/>
  </filter>
</defs>

<!-- Flat colours only: an ink tile, the lit and shaded halves of the A, and the pink crossbar. -->
<g filter="url(#shadow)"><path d="${tile}" fill="#0f0e14"/></g>
<path d="M ${512 - apex} ${top} H 512 V ${yin} L ${L0 + t} ${bot} H ${L0} Z" fill="#f7f5fb"/>
<path d="M 512 ${top} H ${512 + apex} L ${R0} ${bot} H ${R0 - t} L 512 ${yin} Z" fill="#bfb9cf"/>
<path d="M ${512 - hw(b1)} ${b1} H 512 V ${b2} H ${512 - hw(b2)} Z" fill="#ff3ea5"/>
<path d="M 512 ${b1} H ${512 + hw(b1)} L ${512 + hw(b2)} ${b2} H 512 Z" fill="#d22a85"/>
${full ? `<path d="${tile}" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="4"/>` : ''}`;
</script>
