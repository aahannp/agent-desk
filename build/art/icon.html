<!doctype html>
<!-- Agent Desk app icon, drawn on Apple's 1024 grid: an 824px tile centred on a transparent canvas.
     #small is the simpler version for 32 point icons, #tiny the plainest one for 16 pixels. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
<svg id="icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const size = location.hash.slice(1) || 'full';
const full = size === 'full', tiny = size === 'tiny';

// Rounded rectangle with Apple-style continuous corners (Figma's corner smoothing, 60%).
function squircle(x, y, w, h, r, smoothing = 0.6) {
  const rad = deg => deg * Math.PI / 180;
  const p = (1 + smoothing) * r;
  const arc = 90 * (1 - smoothing);
  const L = Math.sin(rad(arc / 2)) * r * Math.SQRT2;
  const c = r * Math.tan(rad((90 - arc) / 4)) * Math.cos(rad(45 * smoothing));
  const d = c * Math.tan(rad(45 * smoothing));
  const b = (p - L - c - d) / 3;
  const n = v => +v.toFixed(3);
  const [A, AB, ABC, C, D, BC, l] = [2 * b, 3 * b, 3 * b + c, c, d, b + c, L].map(n);
  return `M ${n(x + w - p)} ${y}
    c ${A} 0 ${AB} 0 ${ABC} ${D} a ${r} ${r} 0 0 1 ${l} ${l} c ${D} ${C} ${D} ${BC} ${D} ${ABC} L ${x + w} ${n(y + h - p)}
    c 0 ${A} 0 ${AB} ${-D} ${ABC} a ${r} ${r} 0 0 1 ${-l} ${l} c ${-C} ${D} ${-BC} ${D} ${-ABC} ${D} L ${n(x + p)} ${y + h}
    c ${-A} 0 ${-AB} 0 ${-ABC} ${-D} a ${r} ${r} 0 0 1 ${-l} ${-l} c ${-D} ${-C} ${-D} ${-BC} ${-D} ${-ABC} L ${x} ${n(y + p)}
    c 0 ${-A} 0 ${-AB} ${D} ${-ABC} a ${r} ${r} 0 0 1 ${l} ${-l} c ${C} ${-D} ${BC} ${-D} ${ABC} ${-D} Z`;
}

const tile = squircle(100, 100, 824, 824, 185);

// Four terminal panes in a 2x2 grid. Smaller icons get bigger panes and wider gaps so the grid
// survives; at 16px the panes land exactly on pixel edges.
const { grid, gap, radius, border } = {
  full: { grid: 536, gap: 34, radius: 54, border: 3.5 },
  small: { grid: 600, gap: 60, radius: 64, border: 9 },
  tiny: { grid: 640, gap: 128, radius: 52, border: 0 },
}[size];
const pane = (grid - gap) / 2;
const origin = 512 - grid / 2;
const panes = [0, 1, 2, 3].map(i => ({ x: origin + (i % 2) * (pane + gap), y: origin + Math.floor(i / 2) * (pane + gap) }));
const paneShape = p => squircle(p.x, p.y, pane, pane, radius);
const [live, ...idle] = panes;

// Tiny "output" in the three idle panes: [x offset, row, width, colour, opacity, height, corner].
const V = '#a78bfa', CY = '#22d3ee';
const lines = [
  [[0, 0, 128, V, 0.9], [0, 1, 172, V, 0.42], [0, 2, 96, V, 0.42]],
  [[0, 0, 26, CY, 1], [40, 0, 112, V, 0.9], [0, 1, 150, V, 0.42], [0, 2, 70, V, 0.42]],
  [[0, 0, 150, V, 0.9], [0, 1, 104, V, 0.42], [0, 2, 58, V, 0.42], [72, 2, 20, CY, 1, 32, 5]],
];
const bars = !full ? '' : idle.map((p, i) => lines[i].map(([dx, row, w, color, op, h = 16, rx = 8]) =>
  `<rect x="${p.x + 46 + dx}" y="${p.y + 76 + row * 42 - (h - 16) / 2}" width="${w}" height="${h}" rx="${rx}" fill="${color}" opacity="${op}"/>`
).join('')).join('');

// ">_" drawn as strokes so it stays bold and crisp at every size.
const k = pane / 251;
const at = (x, y) => `${live.x + x * k} ${live.y + y * k}`;
const prompt = `M ${at(60, 80)} L ${at(116, 126)} L ${at(60, 172)} M ${at(144, 172)} L ${at(198, 172)}`;
const promptWidth = (full ? 24 : 34) * k;

document.getElementById('icon').innerHTML = `
<defs>
  <clipPath id="tileClip"><path d="${tile}"/></clipPath>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.32"/>
  </filter>
</defs>

<!-- Flat colours only: a solid ink tile, solid violet panes, one solid pink pane with the prompt. -->
<g filter="url(#shadow)"><path d="${tile}" fill="#151020"/></g>
<g clip-path="url(#tileClip)">
  ${idle.map(p => `<path d="${paneShape(p)}" fill="${tiny ? '#5b3fb0' : '#231942'}" stroke="#8b5cf6" stroke-width="${border}"/>`).join('')}
  ${bars}
  <path d="${paneShape(live)}" fill="#ff3ea5"/>
  ${tiny ? '' : `<path d="${prompt}" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="${promptWidth}"/>`}
  ${tiny ? '' : `<path d="${tile}" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="5"/>`}
</g>`;
</script>
