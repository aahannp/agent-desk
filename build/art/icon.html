<!doctype html>
<!-- Agent Desk app icon, drawn on Apple's 1024 grid: an 824px tile centred on a transparent canvas.
     #small is the simpler version for 32 point icons, #tiny the plainest one for 16 pixels. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
<svg id="icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const size = location.hash.slice(1) || 'full';
const full = size === 'full', tiny = size === 'tiny';

// Rounded rectangle with Apple-style continuous corners (Figma's corner smoothing, 60%).
function squircle(x, y, w, h, r, smoothing = 0.6) {
  const rad = deg => deg * Math.PI / 180;
  const p = (1 + smoothing) * r;
  const arc = 90 * (1 - smoothing);
  const L = Math.sin(rad(arc / 2)) * r * Math.SQRT2;
  const c = r * Math.tan(rad((90 - arc) / 4)) * Math.cos(rad(45 * smoothing));
  const d = c * Math.tan(rad(45 * smoothing));
  const b = (p - L - c - d) / 3;
  const n = v => +v.toFixed(3);
  const [A, AB, ABC, C, D, BC, l] = [2 * b, 3 * b, 3 * b + c, c, d, b + c, L].map(n);
  return `M ${n(x + w - p)} ${y}
    c ${A} 0 ${AB} 0 ${ABC} ${D} a ${r} ${r} 0 0 1 ${l} ${l} c ${D} ${C} ${D} ${BC} ${D} ${ABC} L ${x + w} ${n(y + h - p)}
    c 0 ${A} 0 ${AB} ${-D} ${ABC} a ${r} ${r} 0 0 1 ${-l} ${l} c ${-C} ${D} ${-BC} ${D} ${-ABC} ${D} L ${n(x + p)} ${y + h}
    c ${-A} 0 ${-AB} 0 ${-ABC} ${-D} a ${r} ${r} 0 0 1 ${-l} ${-l} c ${-D} ${-C} ${-D} ${-BC} ${-D} ${-ABC} L ${x} ${n(y + p)}
    c 0 ${-A} 0 ${-AB} ${D} ${-ABC} a ${r} ${r} 0 0 1 ${l} ${-l} c ${C} ${-D} ${BC} ${-D} ${ABC} ${-D} Z`;
}

const tile = squircle(100, 100, 824, 824, 185);

// Four terminal panes in a 2x2 grid. Smaller icons get bigger panes and wider gaps so the grid
// survives; at 16px the panes land exactly on pixel edges.
const { grid, gap, radius, border } = {
  full: { grid: 536, gap: 34, radius: 54, border: 3.5 },
  small: { grid: 600, gap: 60, radius: 64, border: 9 },
  tiny: { grid: 640, gap: 128, radius: 52, border: 0 },
}[size];
const pane = (grid - gap) / 2;
const origin = 512 - grid / 2;
const panes = [0, 1, 2, 3].map(i => ({ x: origin + (i % 2) * (pane + gap), y: origin + Math.floor(i / 2) * (pane + gap) }));
const paneShape = p => squircle(p.x, p.y, pane, pane, radius);
const [live, ...idle] = panes;

// Tiny "output" in the three idle panes: [x offset, row, width, colour, opacity, height, corner].
const V = '#a78bfa', CY = '#22d3ee';
const lines = [
  [[0, 0, 128, V, 0.9], [0, 1, 172, V, 0.42], [0, 2, 96, V, 0.42]],
  [[0, 0, 26, CY, 1], [40, 0, 112, V, 0.9], [0, 1, 150, V, 0.42], [0, 2, 70, V, 0.42]],
  [[0, 0, 150, V, 0.9], [0, 1, 104, V, 0.42], [0, 2, 58, V, 0.42], [72, 2, 20, CY, 1, 32, 5]],
];
const bars = !full ? '' : idle.map((p, i) => lines[i].map(([dx, row, w, color, op, h = 16, rx = 8]) =>
  `<rect x="${p.x + 46 + dx}" y="${p.y + 76 + row * 42 - (h - 16) / 2}" width="${w}" height="${h}" rx="${rx}" fill="${color}" opacity="${op}"/>`
).join('')).join('');

// ">_" drawn as strokes so it stays bold and crisp at every size.
const k = pane / 251;
const at = (x, y) => `${live.x + x * k} ${live.y + y * k}`;
const prompt = `M ${at(60, 80)} L ${at(116, 126)} L ${at(60, 172)} M ${at(144, 172)} L ${at(198, 172)}`;
const promptWidth = (full ? 24 : 34) * k;

document.getElementById('icon').innerHTML = `
<defs>
  <clipPath id="tileClip"><path d="${tile}"/></clipPath>
  <linearGradient id="ink" x1="0.2" y1="0" x2="0.5" y2="1">
    <stop offset="0" stop-color="${tiny ? '#1f1240' : '#2a1660'}"/>
    <stop offset="0.5" stop-color="#160e2c"/>
    <stop offset="1" stop-color="#0b0c10"/>
  </linearGradient>
  <radialGradient id="violetBloom" cx="0.3" cy="0" r="0.8">
    <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.42"/>
    <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="pinkGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ff3ea5" stop-opacity="0.6"/>
    <stop offset="0.55" stop-color="#ff3ea5" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#ff3ea5" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.15"/>
    <stop offset="0.4" stop-color="#fff" stop-opacity="0.02"/>
    <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.32"/>
    <stop offset="0.3" stop-color="#fff" stop-opacity="0.07"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0.04"/>
  </linearGradient>
  <linearGradient id="paneFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c4b5fd" stop-opacity="${full ? 0.13 : tiny ? 0.62 : 0.36}"/>
    <stop offset="1" stop-color="#8b5cf6" stop-opacity="${full ? 0.05 : tiny ? 0.5 : 0.22}"/>
  </linearGradient>
  <linearGradient id="paneEdge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ede9fe" stop-opacity="0.85"/>
    <stop offset="0.45" stop-color="#a78bfa" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.22"/>
  </linearGradient>
  <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff74c4"/>
    <stop offset="0.5" stop-color="#ff3ea5"/>
    <stop offset="1" stop-color="#e61e8c"/>
  </linearGradient>
  <linearGradient id="hotEdge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
    <stop offset="0.5" stop-color="#fff" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.38"/>
    <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.22"/>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="${full ? 7 : 10}"/></filter>
  <filter id="hotGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="34"/></filter>
</defs>

<g filter="url(#shadow)"><path d="${tile}" fill="#0b0c10"/></g>
<g clip-path="url(#tileClip)">
  <path d="${tile}" fill="url(#ink)"/>
  ${tiny ? '' : `
  <rect x="100" y="100" width="824" height="824" fill="url(#violetBloom)"/>
  <ellipse cx="512" cy="${full ? 610 : 560}" rx="400" ry="300" fill="url(#pinkGlow)" filter="url(#soft)"/>
  <path d="${tile}" fill="url(#sheen)"/>
  <g filter="url(#glow)" opacity="0.55">
    ${idle.map(p => `<path d="${paneShape(p)}" fill="none" stroke="#8b5cf6" stroke-width="${border * 2}"/>`).join('')}
  </g>
  <path d="${paneShape(live)}" fill="#ff3ea5" filter="url(#hotGlow)" opacity="0.9"/>`}

  ${idle.map(p => `<path d="${paneShape(p)}" fill="url(#paneFill)" stroke="url(#paneEdge)" stroke-width="${border}"/>`).join('')}
  ${bars}
  <path d="${paneShape(live)}" fill="url(#hot)" stroke="url(#hotEdge)" stroke-width="${border}"/>
  ${tiny ? '' : `
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="${promptWidth}">
    <path d="${prompt}" stroke="#7a0a45" stroke-opacity="0.35" transform="translate(0 ${6 * k})"/>
    <path d="${prompt}" stroke="#fff"/>
  </g>
  <path d="${tile}" fill="none" stroke="url(#rim)" stroke-width="5"/>`}
</g>`;
</script>
