<!doctype html>
<!-- DMG window background, 660x420 points, in flat colours only. Finder draws the app icon centred at
     (180, 235) and the Applications link at (480, 235), both 112pt, with their labels just below. Finder
     paints those labels black in light mode and white in dark mode, so each sits on a mid-tone pill that
     both colours read on (#7c739e: about 4.8:1 for black, 4.4:1 for white). -->
<meta charset="utf-8">
<style>
  :root { --ink: #100c19; --pink: #ff3ea5; --violet: #8b5cf6; --mono: ui-monospace, "SF Mono", Menlo, monospace; --sans: -apple-system, "SF Pro Display", system-ui, sans-serif; }
  html, body { margin: 0; width: 660px; height: 420px; overflow: hidden; }
  body { position: relative; font-family: var(--sans); color: #fff; -webkit-font-smoothing: antialiased; background: var(--ink); }
  .layer { position: absolute; inset: 0; }
  .grain { opacity: .05; mix-blend-mode: overlay; }

  /* A quiet echo of the icon: four thin pane outlines in the top right corner. */
  .motif { position: absolute; right: -60px; top: -96px; display: grid; grid-template-columns: 96px 96px; gap: 14px; transform: rotate(-8deg); }
  .motif i { width: 96px; height: 96px; border-radius: 24px; border: 1.5px solid rgba(139, 92, 246, .22); }
  .motif i:first-child { border-color: rgba(255, 62, 165, .35); background: rgba(255, 62, 165, .06); }

  header { position: absolute; left: 38px; top: 34px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .wordmark { font-size: 30px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; padding-bottom: 2px; }
  .tag { display: inline-flex; align-items: center; gap: 7px; margin: 12px 0 0 1px; padding: 5px 10px 5px 9px; font: 600 8px/1 var(--mono); letter-spacing: .28em; color: rgba(255, 255, 255, .6); border-radius: 99px; border: 1px solid rgba(255, 255, 255, .12); }
  .tag::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--pink); }

  /* The drop zone: one hairline frame around both icons. */
  .zone { position: absolute; left: 92px; top: 156px; width: 476px; height: 172px; border-radius: 30px; border: 1px dashed rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .02); }
  .pill { position: absolute; top: 292px; width: 110px; height: 22px; margin-left: -55px; border-radius: 11px; background: #7c739e; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14); }

  .caption { position: absolute; left: 0; right: 0; top: 345px; text-align: center; font-size: 13px; font-weight: 500; letter-spacing: -0.01em; color: rgba(255, 255, 255, .82); }
  footer { position: absolute; left: 0; right: 0; bottom: 22px; display: flex; align-items: center; justify-content: center; gap: 12px; font: 500 8px/1 var(--mono); letter-spacing: .3em; text-transform: uppercase; color: rgba(255, 255, 255, .42); }
  footer i { width: 32px; height: 1px; background: rgba(255, 255, 255, .2); }
</style>

<div class="motif"><i></i><i></i><i></i><i></i></div>
<svg class="layer grain" width="660" height="420">
  <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/></filter>
  <rect width="100%" height="100%" filter="url(#noise)"/>
</svg>

<header>
  <div class="brand">
    <svg width="23" height="23" viewBox="0 0 23 23" fill="none">
      <rect x="0" y="0" width="10.5" height="10.5" rx="3" fill="#ff3ea5"/>
      <rect x="12.9" y="0.4" width="9.7" height="9.7" rx="2.7" stroke="#8b5cf6" stroke-width=".9"/>
      <rect x="0.4" y="12.9" width="9.7" height="9.7" rx="2.7" stroke="#8b5cf6" stroke-width=".9"/>
      <rect x="12.9" y="12.9" width="9.7" height="9.7" rx="2.7" stroke="#22d3ee" stroke-width=".9"/>
      <path d="M3 3.2 L5.4 5.25 L3 7.3" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="wordmark">Agent Desk</div>
  </div>
  <div class="tag">INSTALL · v1.0</div>
</header>

<div class="zone"></div>
<div class="pill" style="left: 180px"></div>
<div class="pill" style="left: 480px"></div>

<svg class="layer" width="660" height="420" viewBox="0 0 660 420">
  <g fill="none" stroke="#ff3ea5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 258 240 C 298 210, 362 207, 400 232"/>
    <path d="M 395.2 218.8 L 400 232 L 386.1 233.5"/>
  </g>
</svg>

<div class="caption">Drag to Applications to install</div>
<footer><i></i>Run many Claude Code agents side by side<i></i></footer>
