<!doctype html>
<!-- The website's social card, 1200x630: the mark, the name and the tagline, white on ink. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { display: flex; align-items: center; gap: 72px; padding: 0 110px; box-sizing: border-box; background: #0f0e14; color: #f4f4f6;
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  /* The mark file is black; invert makes it white. */
  img { width: 300px; height: 300px; flex-shrink: 0; filter: invert(1); }
  h1 { margin: 0; font-size: 132px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; }
  p { margin: 22px 0 0 4px; font-size: 38px; font-weight: 500; letter-spacing: -0.02em; color: rgba(244, 244, 246, .62); }
</style>
<img src="relay-mark.svg" alt="">
<div><h1>Relay</h1><p>Delegate the work.<br>Own the outcome.</p></div>
