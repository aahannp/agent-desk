<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23151020'/%3E%3Crect x='6' y='6' width='9' height='9' rx='2.5' fill='%23ff3ea5'/%3E%3Crect x='17' y='6' width='9' height='9' rx='2.5' fill='none' stroke='%238b5cf6' stroke-width='1.6'/%3E%3Crect x='6' y='17' width='9' height='9' rx='2.5' fill='none' stroke='%238b5cf6' stroke-width='1.6'/%3E%3Crect x='17' y='17' width='9' height='9' rx='2.5' fill='none' stroke='%2322d3ee' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app-bg" aria-hidden="true"><div class="grain"></div></div>
<div class="app">
  <aside class="side">
    <div class="side-top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="8.5" fill="#151020" stroke="rgba(255,255,255,.12)"/>
          <rect x="6.5" y="6.5" width="8.5" height="8.5" rx="2.4" fill="var(--accent)"/>
          <rect x="17" y="6.5" width="8.5" height="8.5" rx="2.4" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
          <rect x="6.5" y="17" width="8.5" height="8.5" rx="2.4" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
          <rect x="17" y="17" width="8.5" height="8.5" rx="2.4" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
        </svg>
        <span>Agent Desk</span><span class="ver">1.0</span>
      </div>
    </div>
    <button class="project-switch" id="projectSwitch" title="Switch project">
      <span class="project-avatar">A</span>
      <span class="project-text"><span class="project-name">No project</span><span class="project-path">Add a folder to start</span></span>
      <span class="chev"></span>
    </button>
    <nav class="nav" id="nav"></nav>
    <div class="side-label">Running</div>
    <div class="running" id="running"></div>
    <div class="side-foot">
      <button class="voice-btn" id="voiceBtn" title="Voice input (⌘⇧M)"><span class="mic"></span><span>Voice</span><kbd>⌘⇧M</kbd></button>
      <button class="palette-btn" id="paletteBtn" title="Command palette"><span class="search"></span><span>Commands</span><kbd>⌘K</kbd></button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="crumbs"><span class="view-icon" id="viewIcon"></span><div class="titles"><h1 id="viewTitle">Agents</h1><span id="viewHint" class="muted"></span></div></div>
      <div class="actions" id="viewActions"></div>
    </header>
    <div class="views" id="views"></div>
    <footer class="status-bar" id="statusBar"></footer>
  </main>
</div>
<div id="toasts"></div>
<div id="voicePill" class="voice-pill" hidden></div>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/monaco/vs/loader.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
