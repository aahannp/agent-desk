<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='100 100 824 824'%3E%3Crect x='100' y='100' width='824' height='824' rx='190' fill='%230f0e14'/%3E%3Cpath d='M 478 298 H 512 V 509.82 L 398 742 H 260 Z' fill='%23f7f5fb'/%3E%3Cpath d='M 512 298 H 546 L 764 742 H 626 L 512 509.82 Z' fill='%23bfb9cf'/%3E%3Cpath d='M 480.49 574 H 512 V 664 H 436.3 Z' fill='%23ff3ea5'/%3E%3Cpath d='M 512 574 H 543.51 L 587.7 664 H 512 Z' fill='%23d22a85'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app-bg" aria-hidden="true"><div class="grain"></div></div>
<div class="app">
  <aside class="side">
    <div class="side-top">
      <div class="brand">
        <svg class="logo" viewBox="100 100 824 824" aria-hidden="true">
          <rect x="112" y="112" width="800" height="800" rx="184" fill="#0f0e14" stroke="rgba(255,255,255,.14)" stroke-width="24"/>
          <path d="M 478 298 H 512 V 509.82 L 398 742 H 260 Z" fill="#f7f5fb"/><path d="M 512 298 H 546 L 764 742 H 626 L 512 509.82 Z" fill="#bfb9cf"/>
          <path d="M 480.49 574 H 512 V 664 H 436.3 Z" fill="var(--accent)"/><path d="M 512 574 H 543.51 L 587.7 664 H 512 Z" style="fill: color-mix(in srgb, var(--accent) 82%, #000)"/>
        </svg>
        <span>Agent Desk</span><span class="ver">1.0</span>
      </div>
    </div>
    <button class="project-switch" id="projectSwitch" title="Switch project">
      <span class="project-avatar">A</span>
      <span class="project-text"><span class="project-name">No project</span><span class="project-path">Add a folder to start</span></span>
      <span class="chev"></span>
    </button>
    <nav class="nav" id="nav"></nav>
    <div class="side-label">Chats</div>
    <div class="running" id="running"></div>
    <div class="side-foot">
      <button class="voice-btn" id="voiceBtn" title="Voice input (⌘⇧M)"><span class="mic"></span><span>Voice</span><kbd>⌘⇧M</kbd></button>
      <button class="palette-btn" id="paletteBtn" title="Command palette"><span class="search"></span><span>Commands</span><kbd>⌘K</kbd></button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="crumbs"><span class="view-icon" id="viewIcon"></span><div class="titles"><h1 id="viewTitle">Agents</h1><span id="viewHint" class="muted"></span></div></div>
      <div class="actions" id="viewActions"></div>
    </header>
    <div class="views" id="views"></div>
    <footer class="status-bar" id="statusBar"></footer>
  </main>
</div>
<div id="toasts"></div>
<div id="voicePill" class="voice-pill" hidden></div>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/addon-webgl.js"></script>
<script src="/vendor/addon-serialize.js"></script>
<script src="/vendor/monaco/vs/loader.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
